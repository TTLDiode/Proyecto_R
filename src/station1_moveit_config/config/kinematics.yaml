# Solucionador cinematico del grupo del brazo.
#
# position_only_ik es obligatorio aqui y conviene entender por que. La cadena
# tiene tres grados de libertad y la orientacion de la herramienta no es libre:
# tool0 gira solidariamente con theta1 + theta2 y sus otros dos ejes estan
# fijos, de modo que la guinada queda determinada en cuanto se fija la posicion
# y la rama del codo. Pedirle a un solucionador que case los seis componentes
# de una pose es pedirle lo imposible: fallaria en todas las poses menos en un
# conjunto de medida nula. Con position_only_ik se le piden solo los tres
# componentes de posicion, que es justo lo que la maquina puede cumplir.
#
# KDL es un metodo numerico iterativo. La cinematica inversa propia
# (matlab/station1/e1_inversa.m) es cerrada y resuelve el mismo problema de
# forma exacta. La Entrega 2 pide contrastar ambas y esa comparacion esta en
# resultados/comparacion_moveit_vs_propia.md.
brazo:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
