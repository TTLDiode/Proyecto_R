# Limites de planificacion del brazo: los mismos que usa la via propia
# (station2_control/trayectoria.py), para que la comparacion entre las dos
# vias sea limpia.
#
# Velocidades: el 70 % (MARGEN_VELOCIDAD) de las del URDF, que salen del
# Pololu 37D 50:1 a 12 V (20.944 rad/s en el eje) por cada transmision:
#   theta1  3:1                 6.981 rad/s   -> 4.887
#   theta2  1:1                20.944 rad/s   -> 14.661
#   d3      1:3, husillo Tr8    0.080 m/s     -> 0.056
#
# Aceleraciones: par que deja pasar el TB6612FNG por la relacion, dividido por
# la inercia del CAD con el brazo extendido, y reducido con margen para el
# lazo de posicion:
#   theta1  1.167 N.m / 0.075 kg m2 = 15.6 rad/s2  -> 4.0
#   theta2  0.389 N.m / 0.020 kg m2 = 19.5 rad/s2  -> 4.0
#   d3      44 N contra 3 N de peso                -> 0.5 m/s2

joint_limits:
  station2/joint_1:
    has_velocity_limits: true
    max_velocity: 4.887
    has_acceleration_limits: true
    max_acceleration: 4.0
  station2/joint_2:
    has_velocity_limits: true
    max_velocity: 14.661
    has_acceleration_limits: true
    max_acceleration: 4.0
  station2/joint_3:
    has_velocity_limits: true
    max_velocity: 0.056
    has_acceleration_limits: true
    max_acceleration: 0.5
  station2/dedo_1_joint:
    has_velocity_limits: true
    max_velocity: 0.05
    has_acceleration_limits: true
    max_acceleration: 0.5
  station2/dedo_2_joint:
    has_velocity_limits: true
    max_velocity: 0.05
    has_acceleration_limits: true
    max_acceleration: 0.5
