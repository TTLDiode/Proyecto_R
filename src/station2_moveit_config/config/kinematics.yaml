# Solucionador cinematico del grupo del brazo.
#
# position_only_ik es obligatorio: la TRIADA tiene tres grados de libertad y
# la orientacion de tool0 no es libre (gira con theta1 + theta2 y sus otros dos
# ejes son fijos). Pedir los seis componentes de una pose haria fallar al
# solucionador casi siempre; se le piden solo los tres de posicion.
#
# KDL es iterativo. La inversa propia (station2_control/cinematica.py y
# matlab/station2/e2_inversa.m) es cerrada. La comparacion entre las dos esta
# en resultados/estacion2/comparacion_moveit_vs_propia.md.
brazo:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
