# Poses de la linea, todas en frame "world". Unidades: metros y radianes.
#
# Propiedad compartida. Toda modificacion se acuerda entre los tres integrantes,
# porque un cambio aqui mueve los puntos de traspaso de dos estaciones a la vez.
#
# Revision del 9 de agosto de 2026. La separacion entre estaciones era de
# 0.700 m, lo que situaba los puntos de traspaso a 350 mm de cada base. La guia
# limita el envolvente de trabajo a un radio de 320 mm +/- 20 mm, es decir
# 340 mm como maximo, de modo que cinco de los seis puntos de tarea quedaban
# fuera de alcance. Con una separacion de 0.500 m todos caen al 78 % del radio
# nominal, con el brazo lejos de la singularidad de extension completa.

frame_id: world

# Poses base de cada estacion en el mundo
station_bases:
  station1: { x: 0.000, y: 0.000, z: 0.0, yaw: 0.0 }
  station2: { x: 0.500, y: 0.000, z: 0.0, yaw: 0.0 }
  station3: { x: 0.910, y: 0.000, z: 0.0, yaw: 180.0 }

# Bandeja de entrada de la Estacion 1.
# La comprobacion de alcance se hace contra la esquina mas lejana de la zona de
# dispersion, no contra su centro: la pieza puede aparecer en cualquier punto.
input_tray:
  center: { x: -0.180, y: 0.100, z: 0.050 }
  size:   { x:  0.100, y: 0.100 }

# Punto fijo de traspaso de la Estacion 1 a la Estacion 2.
# Equidistante de ambas bases, a 250 mm de cada una.
handoff_1_2:
  position:    { x: 0.250, y: 0.000, z: 0.060 }
  orientation: { roll: 0.0, pitch: 0.0, yaw: 0.0 }

# Punto de entrada de la Estacion 3, a 250 mm de las bases 2 y 3.
handoff_2_3:
  position:    { x: 0.750, y: 0.000, z: 0.060 }
  orientation: { roll: 0.0, pitch: 0.0, yaw: 0.0 }

# Cajas de empaque de la Estacion 3.
# CORRECCION (2 oct 2026): la Estacion 3 es RRP, no PRR como asumia la nota
# anterior. Con brazos de 0.1 m (a12=a23), el alcance maximo mecanico real es
# 0.2 m desde la base, muy por debajo del envolvente de 320 mm que permite la
# guia. Se recalcularon la base de la estacion (nueva posicion y yaw=180 para
# que el brazo quede de frente al punto de entrada) y las cajas, verificando
# cada punto contra la cinematica inversa real (limites articulares incluidos,
# no solo la distancia radial). handoff_2_3 no se modifico.
packing:
  units_per_box: 10
  categories: ["A", "B", "C"]
  box_slots:
    A: { x: 0.830, y: -0.100, z: 0.040 }
    B: { x: 0.810, y:  0.000, z: 0.060 }
    C: { x: 0.830, y:  0.100, z: 0.040 }
  next_box_offset: { x: 0.0, y: 0.0, z: 0.030 }

# Restricciones verificables de la guia
constraints:
  station1_cycle_time_s:    30.0
  station2_position_tol_mm: 20.0
  station3_units_per_box:   10

# Restricciones dimensionales de la guia, comunes a las tres estaciones.
# El envolvente XY se interpreta como el alcance maximo medido desde la base.
envelope:
  xy_radius_mm:   320.0
  xy_tol_mm:       20.0
  yz_height_mm:   300.0
  yz_tol_mm:       20.0
